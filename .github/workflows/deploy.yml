name: Deploy Contracts to Testnet

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli

      - name: Build contracts
        run: |
          cargo build --target wasm32-unknown-unknown --release
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/campaign_manager.wasm
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/governance_token.wasm
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/vault.wasm

      - name: Deploy to Testnet
        run: |
          echo "Generating identities..."
          stellar keys generate deployer --network testnet
          stellar keys fund deployer --network testnet

          echo "Deploying Vault Contract..."
          VAULT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/vault.optimized.wasm \
            --source deployer \
            --network testnet 2>deploy_err.log) || { cat deploy_err.log; exit 1; }
          echo "Vault Contract deployed at: $VAULT_ID"

          echo "Deploying Governance Token Contract..."
          GOV_TOKEN_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/governance_token.optimized.wasm \
            --source deployer \
            --network testnet 2>deploy_err.log) || { cat deploy_err.log; exit 1; }
          echo "Governance Token Contract deployed at: $GOV_TOKEN_ID"

          echo "Deploying Campaign Manager Contract..."
          CAMPAIGN_MANAGER_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/campaign_manager.optimized.wasm \
            --source deployer \
            --network testnet 2>deploy_err.log) || { cat deploy_err.log; exit 1; }
          echo "Campaign Manager Contract deployed at: $CAMPAIGN_MANAGER_ID"
          
          echo "Fetching Test Token (Native XLM asset) ID..."
          TOKEN_ID=$(stellar contract id asset --asset native --network testnet)
          echo "Native Token ID is: $TOKEN_ID"

          echo "=================================================="
          echo " Deployment complete! Paste these into Vercel:"
          echo "=================================================="
          echo " VITE_VAULT_CONTRACT_ID=$VAULT_ID"
          echo " VITE_GOV_TOKEN_CONTRACT_ID=$GOV_TOKEN_ID"
          echo " VITE_CAMPAIGN_MANAGER_CONTRACT_ID=$CAMPAIGN_MANAGER_ID"
          echo " VITE_NATIVE_TOKEN_ID=$TOKEN_ID"
          echo "=================================================="
